[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid
loglevel=info
user=root

[program:x-ui]
command=/app/x-ui
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -e /dev/stderr -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
