map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # Generated from OMID_RAILWAY_PORTS before Nginx starts.
    # PORT is always included as the default Railway domain target.
    include /etc/nginx/omid-listeners.conf;
    server_name _;

    client_max_body_size 64m;
    access_log /dev/stdout;
    error_log /dev/stderr notice;

    # Health probe for hosting platforms (HTTP only inside the container).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Custom paths generated at start from OMID_ROUTES (see omid-gen-routes.sh).
    # Wildcard include: nginx starts even if the file is absent.
    include /etc/nginx/omid-routes*.conf;

    # Legacy single inbound: VLESS + WebSocket on port 8081, path /ws.
    location ~ ^/ws(?:/|$) {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Multi-inbound routing on the single public port 2053.
    # An inbound listening on internal port N (8081..8090) is reached through
    # the path prefix that matches its transport:
    #   /wsN -> WebSocket        (e.g. /ws8083 -> 127.0.0.1:8083)
    #   /huN -> HTTPUpgrade      (e.g. /hu8084 -> 127.0.0.1:8084)
    #   /xhN -> XHTTP            (e.g. /xh8085 -> 127.0.0.1:8085)
    # The inbound's own path in 3X-UI must equal this prefix (e.g. /ws8083).
    # With a variable in proxy_pass and no URI part, the original request URI
    # is forwarded untouched, so the inbound sees exactly /ws8083/....
    location ~ ^/(?:ws|hu|xh)(?<xport>808[1-9]|8090)(?:/|$) {
        proxy_pass http://127.0.0.1:$xport;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 3X-UI subscription server: keep these paths in sync with Settings > Subscription.
    # Keep matching case-insensitive for old database values. New installations
    # and Reset Settings use /sub/, /json/ and /clash/. No trailing URI on proxy_pass
    # means the original
    # request URI (with its original case) is forwarded untouched.
    location ~* ^/(?:sub|json|clash|mihomo|clash-legacy)/ {
        proxy_pass http://127.0.0.1:2096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Everything else goes to the original 3X-UI web panel.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
